[project]
name = "digital_twin"
version = "0.1.0"
description = "digital_twin using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "gradio>=6.30.0",
    "openai>=2.54.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
digital_twin = "digital_twin.main:run"
run_crew = "digital_twin.main:run"
train = "digital_twin.main:train"
replay = "digital_twin.main:replay"
test = "digital_twin.main:test"
run_with_trigger = "digital_twin.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
